{% extends 'base.html' %}
{% block content %}
<h2>Admin News Control Panel</h2>
<form method="post" class="row g-2">
  <div class="col-md-5"><input name="title" class="form-control" placeholder="News headline" required></div>
  <div class="col-md-3">
    <select name="sector" class="form-select">
      {% for s in config.sectors %}<option value="{{ s.name }}">{{ s.name }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-2"><input name="impact" step="0.01" type="number" class="form-control" placeholder="0.08" required></div>
  <div class="col-md-2"><button class="btn btn-primary w-100">Publish News</button></div>
</form>
<p class="mt-3 text-muted">Use positive impact for bullish news and negative for bearish sector updates.</p>
{% endblock %}
